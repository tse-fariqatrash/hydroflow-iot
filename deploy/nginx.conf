# /etc/nginx/sites-available/hydroflow
#
# TLS termination + WebSocket upgrade in front of the Node process.
# Obtain a certificate first:
#   sudo certbot --nginx -d hydroflow.example.my

upstream hydroflow_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect plain HTTP
server {
    listen 80;
    listen [::]:80;
    server_name hydroflow.example.my;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hydroflow.example.my;

    ssl_certificate     /etc/letsencrypt/live/hydroflow.example.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hydroflow.example.my/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # The dashboard is entirely self-contained: no CDN, no external fonts,
    # no third-party scripts. Keep the policy tight so it stays that way.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss: ws:; frame-ancestors 'self'" always;

    client_max_body_size 4m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Live telemetry socket
    location /ws {
        proxy_pass http://hydroflow_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;      # the socket is long-lived by design
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://hydroflow_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://hydroflow_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
